# Stonefish hull models                                                    #
############################################################################

# Hull lifting-body coefficients consumed by Simulators.StoneFish, read from
# [StoneFish/Model/<General.Vehicle Type>]. Same 8-term formulation and units
# as VSIM's "Body Lift Coefficients" (common/vsim-models.ini):
#   Yuv, Yur, Zuw, Zuq, Muw, Muq, Nuv, Nur
# with the Munk (added-mass) moment applied by the task ([Simulators.StoneFish]
# Hull Munk Moment, below), so these carry only the viscous hull lift. The
# set is symmetric (Muq = Nur, Muw = -Nuv, ...): the yaw and pitch damping
# Nur = Muq = -40 sets the steady turn/pitch gain, fitted with the grey-box
# plant models (user/sim/yaw_ident.py, pitch_ident.py) to lauv-xplore-4:
# yaw r/(U n) ~0.35 over 0.8-1.45 m/s, pitch b/a 0.30 (2026-11).
# Single source for every StoneFish configuration.
#
# Thruster Actuation Map: points mapping the commanded thruster actuation
# (SetThrusterActuation, [-1, 1]) to the one applied in Stonefish, clamped
# outside the points. The field rpm sweep plateaus at ~1300-1400 rpm whatever
# the command (xp6_1600rpm/xp6_1800rpm), the "1400" top breakpoint of every
# LAUV 'Power Model - Conversion - RPM' config: a motor/ESC limit. lauv.scn
# maps actuation 1.0 to 2500 rpm (max_setpoint 261.8 rad/s), so 1400 rpm is
# actuation 0.56.

[StoneFish/Model/lauv]
Hull Body Lift Coefficients         =  -20.6000,    3.8400,  -20.6000,
                                        -3.8400,   -6.0000,  -40.0000,
                                         6.0000,  -40.0000
Thruster Actuation Map - Input      = -1.0, -0.56, 0.56, 1.0
Thruster Actuation Map - Output     = -0.56, -0.56, 0.56, 0.56

[Simulators.StoneFish]
Hull Munk Moment                    = true
